<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>品牌电商销售数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:     #f4f6fa;
    --panel:  #ffffff;
    --ink:    #0f1e34;
    --ink-2:  #2b3a55;
    --muted:  #6b7990;
    --line:   #e3e7ef;
    --line-2: #eef1f6;
    --navy:   #1c3252;
    --navy-2: #284773;
    --blue:   #2c5aa6;
    --teal:   #0e7c8a;
    --slate:  #64748b;
    --amber:  #b45309;
    --red:    #b1364a;
    --green:  #1e7d5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Source Han Sans CN","Helvetica Neue",Arial,sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    height: 56px;
    background: var(--navy);
    color: #fff;
    display: flex; align-items: center;
    padding: 0 24px;
    gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: 0.04em; font-size: 14px;
  }
  .brand-mark {
    width: 20px; height: 20px;
    background: linear-gradient(135deg, #4f86d6 0%, #2c5aa6 60%, #142e5a 100%);
    border-radius: 4px; position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 4px 4px auto auto;
    width: 5px; height: 5px; background: #fff; border-radius: 50%;
  }
  .brand small { color: #aebcd6; font-weight: 400; margin-left: 8px; font-size: 11px; }

  .controls {
    margin-left: auto;
    display: flex; gap: 8px; align-items: center;
  }
  .ctrl {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e7ecf5;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
  }
  .ctrl label { color: #aebcd6; font-size: 11px; }
  .ctrl select {
    background: transparent; color: #fff; border: none; outline: none;
    font: inherit; cursor: pointer;
  }
  .ctrl select option { background: var(--navy-2); color: #fff; }
  .btn {
    background: rgba(255,255,255,0.10);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font: inherit; font-size: 12px;
  }
  .btn:hover { background: rgba(255,255,255,0.18); }
  .btn.primary {
    background: #3a6fc6;
    border-color: #3a6fc6;
  }
  .btn.primary:hover { background: #4f86d6; }

  /* ---------- 卡片网格 ---------- */
  .grid {
    height: calc(100vh - 56px);
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 8px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .card.span-2 { grid-column: span 2; }
  .card.emph { border-color: #c9d6ec; box-shadow: 0 1px 0 #e6edf8 inset, 0 0 0 1px #e6edf8; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--navy-2);
  }
  .card.emph .card-title .dot { background: var(--amber); }
  .card-meta {
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .card-body {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  .card-body canvas { width: 100% !important; height: 100% !important; }

  /* ---------- 数据管理抽屉 ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(15,30,52,0.42);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 680px; max-width: 96vw;
    background: #fff;
    box-shadow: -8px 0 28px rgba(15,30,52,0.18);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 51;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .drawer-head h2 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--ink);
    letter-spacing: 0.02em;
  }
  .drawer-head .close {
    margin-left: auto;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--line-2);
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: var(--ink-2);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .drawer-head .close:hover { background: var(--line); }
  .drawer-bar {
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: #fafbfd;
  }
  .drawer-bar .small-btn {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink-2);
    padding: 6px 11px;
    border-radius: 5px;
    cursor: pointer;
    font: inherit; font-size: 12px;
    transition: background 0.12s, border-color 0.12s;
  }
  .drawer-bar .small-btn:hover { background: var(--line-2); border-color: #c9d2e0; }
  .drawer-bar .small-btn.danger { color: var(--red); }
  .drawer-bar .hint {
    color: var(--muted); font-size: 11px; margin-left: auto;
  }
  .drawer-body {
    flex: 1; overflow-y: auto;
    padding: 4px 22px 18px;
  }
  table.data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  table.data-table th {
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
    padding: 10px 8px 8px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
    background: #fff;
  }
  table.data-table th:first-child { width: 90px; }
  table.data-table th:last-child { width: 36px; }
  table.data-table td {
    padding: 4px 4px;
    border-bottom: 1px solid var(--line-2);
  }
  table.data-table input {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    padding: 6px 8px;
    border-radius: 4px;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  table.data-table input:hover {
    background: #fafbfd;
    border-color: var(--line);
  }
  table.data-table input:focus {
    background: #fff;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(44,90,166,0.12);
  }
  table.data-table input[type="text"] { color: var(--ink-2); font-weight: 500; }
  table.data-table .row-del {
    width: 26px; height: 26px;
    border: none; background: transparent;
    color: var(--muted);
    cursor: pointer; border-radius: 50%;
    font-size: 14px;
  }
  table.data-table .row-del:hover { background: #fde9ec; color: var(--red); }
  .drawer-foot {
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center;
    background: #fafbfd;
  }
  .drawer-foot .status { color: var(--muted); font-size: 12px; }
  .drawer-foot .spacer { flex: 1; }
  .drawer-foot button {
    padding: 8px 16px; border-radius: 5px; font: inherit; font-size: 13px;
    cursor: pointer; border: 1px solid transparent;
  }
  .drawer-foot button.save {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }
  .drawer-foot button.save:hover { background: var(--navy-2); }
  .drawer-foot button.cancel {
    background: #fff; color: var(--ink-2); border-color: var(--line);
  }
  .drawer-foot button.cancel:hover { background: var(--line-2); }

  .paste-overlay {
    position: fixed; inset: 0;
    background: rgba(15,30,52,0.42);
    z-index: 60;
    display: none; align-items: center; justify-content: center;
  }
  .paste-overlay.open { display: flex; }
  .paste-box {
    background: #fff;
    border-radius: 10px;
    width: 600px; max-width: 92vw;
    padding: 22px;
    box-shadow: 0 12px 32px rgba(15,30,52,0.3);
  }
  .paste-box h3 { margin: 0 0 6px; font-size: 14px; }
  .paste-box p { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .paste-box textarea {
    width: 100%; height: 220px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    resize: vertical;
    outline: none;
  }
  .paste-box textarea:focus { border-color: var(--blue); }
  .paste-box .row { display: flex; gap: 8px; margin-top: 12px; }
  .paste-box .row .spacer { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 30px;
    transform: translateX(-50%) translateY(60px);
    background: rgba(15,30,52,0.96); color: #fff;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s, transform 0.22s;
    z-index: 70;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 响应式 */
  @media (max-width: 1400px) {
    .grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, minmax(260px, 1fr)); height: auto; min-height: calc(100vh - 56px); }
    body { overflow: auto; }
    .card.span-2 { grid-column: span 2; }
  }
  @media (max-width: 980px) {
    .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 280px); }
    .card.span-2 { grid-column: span 2; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: repeat(7, 320px); }
    .card.span-2 { grid-column: span 1; }
    .controls .ctrl label { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    品牌电商销售看板
    <small>Sales Dashboard · 一屏总览</small>
  </div>
  <div class="controls">
    <div class="ctrl">
      <label>时间范围</label>
      <select id="rangeSel"></select>
    </div>
    <button class="btn primary" id="manageBtn">⚙ 数据管理</button>
    <button class="btn" id="exportBtn">⬇ 导出 CSV</button>
  </div>
</header>

<main class="grid">
  <!-- Row 1 -->
  <section class="card">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>销售额趋势</div>
      <div class="card-meta" id="m1"></div>
    </div>
    <div class="card-body"><canvas id="c1"></canvas></div>
  </section>

  <section class="card emph">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>同比增长 YoY</div>
      <div class="card-meta" id="m_yoy"></div>
    </div>
    <div class="card-body"><canvas id="c_yoy"></canvas></div>
  </section>

  <section class="card emph">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>环比增长 MoM</div>
      <div class="card-meta" id="m_mom"></div>
    </div>
    <div class="card-body"><canvas id="c_mom"></canvas></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>年度对比（同月叠加）</div>
      <div class="card-meta">销售额 · 按月</div>
    </div>
    <div class="card-body"><canvas id="c2"></canvas></div>
  </section>

  <!-- Row 2 -->
  <section class="card span-2">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>净销售 vs 推广费用</div>
      <div class="card-meta" id="m3"></div>
    </div>
    <div class="card-body"><canvas id="c3"></canvas></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>投产比 ROI</div>
      <div class="card-meta" id="m4"></div>
    </div>
    <div class="card-body"><canvas id="c4"></canvas></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>推广费用占比（按年）</div>
      <div class="card-meta">饼图</div>
    </div>
    <div class="card-body"><canvas id="c5"></canvas></div>
  </section>
</main>

<!-- ============ 数据管理抽屉 ============ -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>数据管理</h2>
    <span style="color:var(--muted);font-size:12px;">编辑、增删每月数据 — 保存后存到本地浏览器</span>
    <button class="close" id="drawerClose" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-bar">
    <button class="small-btn" id="addRowBtn">＋ 新增一行</button>
    <button class="small-btn" id="pasteBtn">📋 从 Excel 粘贴</button>
    <button class="small-btn" id="importBtn">📁 导入 CSV</button>
    <input type="file" id="fileInput" accept=".csv,text/csv" style="display:none">
    <button class="small-btn danger" id="resetBtn">↺ 重置为示例数据</button>
    <span class="hint">单位：元</span>
  </div>
  <div class="drawer-body">
    <table class="data-table">
      <thead>
        <tr>
          <th>月份</th>
          <th>销售额</th>
          <th>净销售额</th>
          <th>推广费用</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="drawer-foot">
    <span class="status" id="status">—</span>
    <span class="spacer"></span>
    <button class="cancel" id="cancelBtn">取消</button>
    <button class="save" id="saveBtn">保存并应用</button>
  </div>
</aside>

<!-- ============ 粘贴框 ============ -->
<div class="paste-overlay" id="pasteOverlay">
  <div class="paste-box">
    <h3>从 Excel 粘贴</h3>
    <p>从 Excel/表格里选中 4 列（月份、销售额、净销售额、推广费用）复制，然后粘贴到下方框内。月份支持 <code>2025/01</code>、<code>2025-1</code>、<code>2025年1月</code> 等格式。</p>
    <textarea id="pasteArea" placeholder="2025/01&#9;2780000&#9;2390800&#9;462000&#10;2025/02&#9;2120000&#9;1823200&#9;378000&#10;..."></textarea>
    <div class="row">
      <span class="status" id="pasteStatus" style="color:var(--muted);font-size:12px;align-self:center;">解析后会追加 / 覆盖到表格</span>
      <span class="spacer"></span>
      <button class="small-btn" id="pasteCancel">取消</button>
      <button class="small-btn" id="pasteConfirm" style="background:var(--navy);color:#fff;border-color:var(--navy);">解析并填入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const STORAGE_KEY = "salesDashboardData_v1";

/* ---------- 加载 / 保存 ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return arr.map(normalizeRow).filter(Boolean);
    }
  } catch (e) {}
  return DEMO_DATA.map(d => ({...d}));
}
function saveData(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function normalizeRow(r) {
  if (!r || !r.time) return null;
  const t = String(r.time).trim();
  // 接受 2025/01, 2025-1, 2025年1月 等
  const m = t.match(/(\d{4})\D+(\d{1,2})/);
  if (!m) return null;
  const time = m[1] + '/' + m[2].padStart(2, '0');
  const num = v => {
    if (v == null || v === '') return 0;
    return +String(v).replace(/[,，\s元¥￥]/g, '') || 0;
  };
  return {
    time,
    销售额: num(r.销售额 ?? r.sales ?? r['销售额']),
    净销售额: num(r.净销售额 ?? r.net ?? r['净销售额']),
    推广费用: num(r.推广费用 ?? r.ad ?? r['推广费用']),
  };
}

function filteredData() {
  // 保持时间排序
  const sorted = [...SALES_DATA].sort((a,b) => a.time.localeCompare(b.time));
  if (state.range === 'all') return sorted;
  if (state.range === 'last12') return sorted.slice(-12);
  return sorted.filter(d => d.time.startsWith(state.range));
}

/* ---------- 时间范围下拉：根据数据动态生成 ---------- */
function refreshRangeOptions() {
  const sel = document.getElementById('rangeSel');
  const years = [...new Set(SALES_DATA.map(d => d.time.slice(0,4)))].sort();
  const allLabel = years.length
    ? (years.length === 1 ? `全部 (${years[0]})` : `全部 (${years[0]}-${years[years.length-1]})`)
    : '全部';
  const opts = [`<option value="all">${allLabel}</option>`]
    .concat(years.slice().reverse().map(y => `<option value="${y}">${y} 年</option>`))
    .concat([`<option value="last12">最近 12 个月</option>`]);
  sel.innerHTML = opts.join('');
  // 保留当前选择；若已失效则回退到 all

document.getElementById('fileInput').addEventListener('change', e => {

function parseCSV(text) {
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  // 检测分隔符
  const sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(',') ? ',' : /\s+/);
  const header = lines[0].split(sep).map(s => s.trim());
  const isHeader = header.some(h => /time|月|销售|推广|net|ad/i.test(h));
  const startAt = isHeader ? 1 : 0;
  // 列序：尝试按表头映射，否则按位置 0=time 1=销售额 2=净销售额 3=推广费用
  const idx = isHeader ? mapHeader(header) : { time:0, 销售额:1, 净销售额:2, 推广费用:3 };
  const out = [];
  for (let i = startAt; i < lines.length; i++) {
    const cells = lines[i].split(sep);
    const r = normalizeRow({
      time: cells[idx.time],
      销售额: cells[idx.销售额],
      净销售额: cells[idx.净销售额],
      推广费用: cells[idx.推广费用],
    });
    if (r) out.push(r);
  }
  return out;
}
function mapHeader(h) {
  const find = (...keys) => h.findIndex(x => keys.some(k => x.toLowerCase().includes(k.toLowerCase())));
  return {
    time: Math.max(0, find('time','月','日期','date')),
    销售额: Math.max(1, find('销售额','sales','gmv') < 0 ? 1 : find('销售额','sales','gmv')),
    净销售额: Math.max(2, find('净销','net') < 0 ? 2 : find('净销','net')),
    推广费用: Math.max(3, find('推广','ad','广告') < 0 ? 3 : find('推广','ad','广告')),
  };
}
function mergeIntoEditing(rows) {
  if (!editingData) editingData = [];
  const map = new Map(editingData.map(r => [r.time, r]));
  rows.forEach(r => map.set(r.time, r));
  editingData = [...map.values()].sort((a,b) => a.time.localeCompare(b.time));
  renderTable();
}

    const mom = before && before.销售额 ? ((d.销售额 - before.销售额)/before.销售额*100).toFixed(2) : '';
    const roi = d.推广费用 > 0 ? (d.净销售额/d.推广费用).toFixed(2) : '';
    return [d.time, d.销售额, d.净销售额, d.推广费用, yoy, mom, roi];
  });
  const csv = '\ufeff' + [head, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `销售数据_${state.range}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

renderAll();
</script>
